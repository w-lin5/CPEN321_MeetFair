# Requires Docker Compose v2.24+ for the `env_file: required:` syntax below.

name: cpen321-project

services:
  backend:
    build: ./backend
    # Published on all interfaces so a physical Android device on the same Wi-Fi
    # can reach it. Emulators use http://10.0.2.2:3000/api/ either way.
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/cpen321
    # HTTPS: put fullchain.pem and privkey.pem in backend/certs/ (gitignored). Without them the
    # server keeps speaking plain HTTP on the same port.
    volumes:
      - ./backend/certs:/app/certs:ro
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  mongo-data:
