<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="985" viewBox="0 0 1560 985" font-family="Arial, Helvetica, sans-serif">
  <!-- Dependency diagram (Requirements_and_Design.md section 4.5). Hand-laid-out SVG; edit coordinates directly.
       An arrow A -> B means A depends on (calls or writes) B. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .comp { fill: #ECECFF; stroke: #9370DB; stroke-width: 1.5; }
      .ext { fill: #F2F2F2; stroke: #888; stroke-width: 1.5; }
      .box { fill: #FFFFDE; stroke: #AAAA33; stroke-width: 1.5; }
      .group { fill: #FFFFF2; stroke: #AAAA33; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .node { font-size: 15px; fill: #222; text-anchor: middle; }
      .title { font-size: 14px; fill: #555; font-weight: bold; }
      .edge { fill: none; stroke: #333; stroke-width: 1.6; }
      .lbl { font-size: 12.5px; fill: #222; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
      .mid { text-anchor: middle; }
      .end { text-anchor: end; }
    </style>
  </defs>

  <rect width="1560" height="985" fill="#FFFFFF"/>

  <!-- Containers -->
  <rect class="box" x="150" y="120" width="1100" height="690" rx="4"/>
  <text class="title end" x="1236" y="144">Back-end (Node.js: Express + Socket.IO)</text>
  <rect class="group" x="170" y="150" width="220" height="640" rx="4"/>
  <text class="title" x="182" y="780">Realtime Gateway</text>
  <rect class="group" x="1040" y="360" width="190" height="280" rx="4"/>
  <text class="title" x="1050" y="630">Voting &amp; Fairness</text>

  <!-- Edges (drawn before nodes so arrowheads meet the borders cleanly) -->
  <!-- Front-end -->
  <path class="edge" d="M560,48 H280 V178" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="420" y="40">Socket.IO</text>
  <path class="edge" d="M660,76 V118" marker-end="url(#arrow)"/>
  <text class="lbl" x="672" y="104">REST: Users &amp; Groups, Recommendation Engine, Voting &amp; Fairness, Live Location</text>
  <path class="edge" d="M760,48 H1308" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="1034" y="40">ID token, Calendar access token</text>

  <!-- Realtime Gateway -->
  <path class="edge" d="M360,208 H458" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="409" y="200">getForMember</text>
  <path class="edge" d="M280,236 V698" marker-end="url(#arrow)"/>
  <text class="lbl" x="290" y="470">setTransport</text>

  <!-- Users & Groups -->
  <path class="edge" d="M460,226 H425 V715 H362" marker-end="url(#arrow)"/>
  <text class="lbl end" x="418" y="560">publish, revokeUser,</text>
  <text class="lbl end" x="418" y="575">closeRoom</text>
  <path class="edge" d="M1230,208 H1410 V78" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="1325" y="200">verify ID token</text>
  <!-- Users & Groups writes other components' models directly when members leave or are removed and when groups or meetups are deleted -->
  <path class="edge" d="M700,236 V338"/>
  <path class="edge" d="M520,338 H1060"/>
  <path class="edge" d="M520,338 V398" marker-end="url(#arrow)"/>
  <path class="edge" d="M800,338 V398" marker-end="url(#arrow)"/>
  <path class="edge" d="M1060,338 V358" marker-end="url(#arrow)"/>
  <circle cx="700" cy="338" r="3.5" fill="#333"/>
  <circle cx="800" cy="338" r="3.5" fill="#333"/>
  <text class="lbl" x="708" y="281">leave / remove / delete:</text>
  <text class="lbl" x="708" y="296">writes their models</text>
  <text class="lbl end" x="514" y="382">Trip</text>
  <text class="lbl end" x="794" y="382">Recommendation</text>
  <text class="lbl end" x="1054" y="374">Vote, FairCredit,</text>
  <text class="lbl end" x="1054" y="389">FairCreditEntry, Settlement</text>

  <!-- Live Location -->
  <path class="edge" d="M560,400 V238" marker-end="url(#arrow)"/>
  <text class="lbl end" x="552" y="300">getForMember,</text>
  <text class="lbl end" x="552" y="315">findByIds</text>
  <path class="edge" d="M650,428 H758" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="704" y="404">stored travel</text>
  <text class="lbl mid" x="704" y="419">estimates</text>
  <path class="edge" d="M630,400 V320 H1100 V398" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="975" y="314">settleMeetup</text>
  <path class="edge" d="M600,456 V878" marker-end="url(#arrow)"/>
  <text class="lbl end" x="592" y="852">computeRouteMatrix</text>

  <!-- Recommendation Engine -->
  <path class="edge" d="M855,400 V238" marker-end="url(#arrow)"/>
  <text class="lbl" x="863" y="262">getForMember,</text>
  <text class="lbl" x="863" y="277">transitionStatus</text>
  <path class="edge" d="M950,428 H1063" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="1003" y="420">getBalances,</text>
  <text class="lbl mid" x="1003" y="446">voteWeight,</text>
  <text class="lbl mid" x="1003" y="461">normalizedBurden</text>
  <path class="edge" d="M780,456 V878" marker-end="url(#arrow)"/>
  <text class="lbl" x="788" y="845">searchNearby,</text>
  <text class="lbl" x="788" y="860">computeRouteMatrix</text>

  <!-- Voting & Fairness -->
  <path class="edge" d="M1180,360 V238" marker-end="url(#arrow)"/>
  <text class="lbl end" x="1172" y="258">getForMember, finalize,</text>
  <text class="lbl end" x="1172" y="273">recordCalendarEvent,</text>
  <text class="lbl end" x="1172" y="288">requireMembership,</text>
  <text class="lbl end" x="1172" y="303">findByIds, getProfile</text>
  <path class="edge" d="M1130,540 V458" marker-end="url(#arrow)"/>
  <text class="lbl" x="1138" y="503">getVoteWeight</text>
  <path class="edge" d="M1065,568 H900 V458" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="982" y="560">getByMeetupId</text>
  <path class="edge" d="M1195,568 H1308" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="1268" y="560">events.insert</text>

  <!-- publish: Live Location, Recommendation Engine and Voting & Fairness share one line into the Event Publisher -->
  <path class="edge" d="M1180,640 V742 H362" marker-end="url(#arrow)"/>
  <path class="edge" d="M830,456 V742"/>
  <path class="edge" d="M530,456 V742"/>
  <circle cx="830" cy="742" r="3.5" fill="#333"/>
  <circle cx="530" cy="742" r="3.5" fill="#333"/>
  <text class="lbl mid" x="1000" y="734">publish</text>
  <text class="lbl mid" x="470" y="734">publish</text>

  <!-- Persistence -->
  <path class="edge" d="M1250,740 H1348" marker-end="url(#arrow)"/>
  <text class="lbl mid" x="1300" y="712">each component's</text>
  <text class="lbl mid" x="1300" y="727">own collections</text>

  <!-- Nodes -->
  <rect class="comp" x="560" y="20" width="200" height="56" rx="8"/>
  <text class="node" x="660" y="44">Front-end</text>
  <text class="node" x="660" y="63">(Android app)</text>

  <rect class="comp" x="200" y="180" width="160" height="56" rx="8"/>
  <text class="node" x="280" y="213">Socket.IO server</text>
  <rect class="comp" x="200" y="700" width="160" height="56" rx="8"/>
  <text class="node" x="280" y="733">Event Publisher</text>

  <rect class="comp" x="460" y="180" width="770" height="56" rx="8"/>
  <text class="node" x="845" y="213">Users &amp; Groups</text>

  <rect class="comp" x="490" y="400" width="160" height="56" rx="8"/>
  <text class="node" x="570" y="433">Live Location</text>
  <rect class="comp" x="760" y="400" width="190" height="56" rx="8"/>
  <text class="node" x="855" y="433">Recommendation Engine</text>
  <rect class="comp" x="1065" y="400" width="130" height="56" rx="8"/>
  <text class="node" x="1130" y="433">Fair Credit</text>
  <rect class="comp" x="1065" y="540" width="130" height="56" rx="8"/>
  <text class="node" x="1130" y="573">Voting</text>

  <rect class="ext" x="1310" y="20" width="200" height="56" rx="8"/>
  <text class="node" x="1410" y="44">Google Sign-In /</text>
  <text class="node" x="1410" y="63">Identity Services</text>
  <rect class="ext" x="1310" y="540" width="200" height="56" rx="8"/>
  <text class="node" x="1410" y="573">Google Calendar API</text>
  <rect class="ext" x="560" y="880" width="240" height="56" rx="8"/>
  <text class="node" x="680" y="904">Google Maps Platform</text>
  <text class="node" x="680" y="923">(Places API, Routes API)</text>

  <path class="ext" d="M1350,718 V768 A60,12 0 0 0 1470,768 V718"/>
  <ellipse class="ext" cx="1410" cy="718" rx="60" ry="12"/>
  <text class="node" x="1410" y="752">MongoDB</text>

  <text x="20" y="972" font-size="13" fill="#555">A → B: A depends on (calls or writes the models of) B. Solid boxes inside a dashed group are modules of that one component.</text>
</svg>
